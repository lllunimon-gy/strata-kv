name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Unit and boundary tests
        run: swift test --enable-code-coverage
      - name: Build runnable example for iOS Simulator
        run: >-
          xcodebuild -project Examples/StrataExample.xcodeproj
          -scheme StrataExample -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Process termination recovery matrix
        run: |
          swift build --product strata-tool
          python3 Scripts/crash_matrix.py
      - name: Reproducible release benchmark
        run: swift run -c release strata-tool benchmark "$RUNNER_TEMP/strata-benchmark" > benchmark.json
      - name: Thread Sanitizer on engine concurrency
        run: swift test --scratch-path .build/tsan --sanitize=thread --filter EngineTests
      - name: Same-host interleaved performance comparison
        run: python3 Benchmarks/compare.py --workspace "$RUNNER_TEMP/strata-compare" --output comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            benchmark.json
            comparison.json
